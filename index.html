<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A0D12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>DetoxBet</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #050608;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    #unity-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* alto real en celulares (sin contar la barra del navegador) */
      display: block;
      background: #0A0D12;
      outline: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0A0D12;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #logo { color: #F2F4F7; font-weight: 700; font-size: 24px; }
    #logo span { color: #00F08A; }
    #bar { width: 160px; height: 4px; border-radius: 2px; background: #1C2230; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #00F08A; transition: width 0.2s; }
    #error { display: none; max-width: 280px; color: #FF5C6C; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <div id="loading">
    <div id="logo">Detox<span>Bet</span></div>
    <div id="bar"><div id="fill"></div></div>
    <div id="error"></div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var config = {
      dataUrl: "Build/detoxBetWeb.data",
      frameworkUrl: "Build/detoxBetWeb.framework.js",
      codeUrl: "Build/detoxBetWeb.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "HCI_teamJorge",
      productName: "DetoxBet",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true,
      // Nitidez sin sobrecargar celulares con pantallas de densidad muy alta
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    var script = document.createElement("script");
    script.src = "Build/detoxBetWeb.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.querySelector("#fill").style.width = (100 * progress) + "%";
      }).then(function () {
        document.querySelector("#loading").remove();
      }).catch(function (message) {
        var error = document.querySelector("#error");
        error.style.display = "block";
        error.textContent = message;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
